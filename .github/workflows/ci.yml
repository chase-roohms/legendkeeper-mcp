name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      LEGENDKEEPER_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    env:
      # The fake API validates every request against LegendKeeper's published OpenAPI spec.
      LK_REQUIRE_SPEC: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Cache OpenAPI spec (refreshed weekly)
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: tests/.cache
          key: openapi-${{ steps.week.outputs.week }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  live:
    name: Live API tests
    # Runs against the real LegendKeeper project behind the LEGENDKEEPER_API_KEY secret. Secrets are not
    # available to fork or Dependabot PRs; the job then skips itself.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: legendkeeper-live-api # one live run at a time (shared rate limits, shared world)
      cancel-in-progress: false
    env:
      LEGENDKEEPER_API_KEY: ${{ secrets.LEGENDKEEPER_API_KEY }}
      LEGENDKEEPER_LIVE_TESTS: "1"
      LEGENDKEEPER_LIVE_WRITE: "1"
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$LEGENDKEEPER_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::LEGENDKEEPER_API_KEY secret not available; skipping live tests."; fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present
      - uses: astral-sh/setup-uv@v10.3.1
        if: steps.key.outputs.present
        with:
          enable-cache: true
      - if: steps.key.outputs.present
        run: uv sync --locked
      - name: Verify key
        if: steps.key.outputs.present
        run: uv run legendkeeper-mcp check
      - name: Live tests (creates and deletes an "[mcp-test] …" sandbox resource)
        if: steps.key.outputs.present
        run: uv run pytest tests/test_live.py -v -m live -p no:cacheprovider

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/legendkeeper-mcp --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: legendkeeper-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run --rm legendkeeper-mcp:ci --version
          # stdio mode exits cleanly when stdin closes
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run --rm -i -e LEGENDKEEPER_API_KEY=lk_dummy legendkeeper-mcp:ci | tee /tmp/stdio.txt
          grep -q '"legendkeeper"' /tmp/stdio.txt
          # HTTP mode refuses to start on 0.0.0.0 without a token
          if docker run --rm -e LEGENDKEEPER_API_KEY=lk_dummy -e MCP_TRANSPORT=http legendkeeper-mcp:ci; then
            echo "expected failure without MCP_AUTH_TOKEN"; exit 1
          fi
          docker run -d --name lk -p 8000:8000 -e LEGENDKEEPER_API_KEY=lk_dummy -e MCP_TRANSPORT=http \
            -e MCP_AUTH_TOKEN=ci-token -e MCP_ALLOWED_HOSTS=localhost:8000,127.0.0.1:8000 legendkeeper-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = "401"
          curl -fsS -X POST http://127.0.0.1:8000/mcp -H "Authorization: Bearer ci-token" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q legendkeeper
          sleep 35 && test "$(docker inspect -f '{{.State.Health.Status}}' lk)" = "healthy"
          docker rm -f lk
