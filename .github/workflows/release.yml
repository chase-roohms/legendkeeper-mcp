name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag and package versions
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/legendkeeper_mcp/__init__.py').read()).group(1))")
          server=$(jq -r '.version' server.json)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag pyproject=$version __init__=$init server.json=$server"
          test "$tag" = "$version" && test "$tag" = "$init" && test "$tag" = "$server"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    secrets:
      LEGENDKEEPER_API_KEY: ${{ secrets.LEGENDKEEPER_API_KEY }}

  pypi:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/legendkeeper-mcp/
    permissions:
      id-token: write # trusted publishing, no API token needed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - run: uv publish --trusted-publishing always

  image:
    name: Publish image to GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  mcp-registry:
    name: Publish to the MCP Registry
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login for the io.github.chase-roohms/* namespace
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate
        run: ./mcp-publisher login github-oidc
      - name: Publish (retries while PyPI and GHCR propagate)
        run: |
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 30s"; sleep 30
          done
          exit 1
