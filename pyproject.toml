[project]
name = "legendkeeper-mcp"
version = "0.1.1"
description = "Unofficial Model Context Protocol (MCP) server for the LegendKeeper worldbuilding API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chase Roohms", email = "chaseroohms@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "legendkeeper", "worldbuilding", "ttrpg", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "markdown-it-py>=3,<5",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.urls]
Homepage = "https://github.com/chase-roohms/legendkeeper-mcp"
Issues = "https://github.com/chase-roohms/legendkeeper-mcp/issues"
"LegendKeeper API" = "https://www.legendkeeper.com/developers/"

[project.scripts]
legendkeeper-mcp = "legendkeeper_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.170.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legendkeeper_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["tests/.cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: runs against the real LegendKeeper API (needs LEGENDKEEPER_LIVE_TESTS=1 and an API key)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["legendkeeper_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "C4", "PIE", "RET", "PT"]
ignore = [
    "E501",   # line length is handled by ruff format; long strings are fine
    "S101",   # assert is fine in tests and for invariants
    "RUF001", # ambiguous unicode in strings (we render typographic text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT018", "PT011", "C901", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["markdown_it.*", "mdit_py_plugins.*"]
ignore_missing_imports = true
